<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Log In - Voice to ISL</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.0/dist/css/bootstrap.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Bree+Serif&family=Raleway:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            background: linear-gradient(135deg, #433d8b 0%, #7f57c5 50%, #c6b3ff 100%);
            color: #fff;
            font-family: 'Raleway', sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .auth-card {
            background: rgba(255,255,255,0.12);
            border: 1px solid rgba(255,255,255,0.18);
            border-radius: 24px;
            padding: 40px;
            width: 100%;
            max-width: 420px;
            box-shadow: 0 30px 60px rgba(0,0,0,0.2);
        }
        .auth-card h2 {
            font-family: 'Bree Serif', serif;
            margin-bottom: 24px;
        }
        .form-control {
            background: rgba(255,255,255,0.12);
            border: 1px solid rgba(255,255,255,0.2);
            color: #fff;
        }
        .form-control::placeholder {
            color: rgba(255,255,255,0.75);
        }
        .btn-primary {
            background: #fff;
            color: #5b3b8a;
            border: none;
            font-weight: 700;
        }
        .btn-secondary {
            background: transparent;
            border: 1px solid rgba(255,255,255,0.35);
            color: #fff;
        }
        .help-text {
            color: #eae3ff;
        }
        .password-wrapper {
            position: relative;
        }
        .password-wrapper .form-control {
            padding-right: 48px;
        }
        .toggle-password {
            position: absolute;
            right: 12px;
            top: 50%;
            transform: translateY(-50%);
            border: none;
            background: transparent;
            color: #fff;
            cursor: pointer;
            font-size: 18px;
            line-height: 1;
            padding: 4px;
        }
        .change-password-link {
            display: inline-block;
            margin: 4px 0 16px;
            color: #fff;
            font-weight: 600;
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="auth-card">
        <h2>Welcome Back</h2>
        <p class="help-text">Log in to continue to Indian Sign Language generation.</p>
        <form id="loginForm">
            <div class="form-group">
                <label for="email">Email address</label>
                <input type="email" id="email" class="form-control" placeholder="Enter email" required>
            </div>
            <div class="form-group">
                <label for="password">Password</label>
                <div class="password-wrapper">
                    <input type="password" id="password" class="form-control" placeholder="Enter password" required>
                    <button type="button" class="toggle-password" data-target="password" aria-label="Show password">&#128065;</button>
                </div>
            </div>
            <a href="/change-password" class="change-password-link">Change password</a>
            <button type="submit" class="btn btn-primary btn-block">Log In</button>
            <a href="/signup" class="btn btn-secondary btn-block">Create an account</a>
        </form>
    </div>
    <script>
        document.querySelectorAll('.toggle-password').forEach(function (button) {
            button.addEventListener('click', function () {
                const input = document.getElementById(button.dataset.target);
                const isHidden = input.type === 'password';
                input.type = isHidden ? 'text' : 'password';
                button.setAttribute('aria-label', isHidden ? 'Hide password' : 'Show password');
            });
        });

        const form = document.getElementById('loginForm');
        form.addEventListener('submit', function (event) {
            event.preventDefault();
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;
            const savedUser = localStorage.getItem('voiceIslUser');
            if (!savedUser) {
                alert('No account found. Please sign up first.');
                window.location.href = '/signup';
                return;
            }
            const user = JSON.parse(savedUser);
            if (user.email === email && user.password === password) {
                localStorage.setItem('voiceIslLoggedIn', 'true');
                window.location.href = '/speech';
            } else {
                alert('Email or password is incorrect.');
            }
        });
    </script>
</body>
</html>
