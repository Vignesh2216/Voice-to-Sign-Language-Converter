<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Continue to Generation</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.0/dist/css/bootstrap.min.css">
    <style>
        body {
            background: linear-gradient(135deg, #523b95 0%, #8d73d6 100%);
            color: #fff;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
        }
        .box {
            background: rgba(255,255,255,0.12);
            border: 1px solid rgba(255,255,255,0.16);
            border-radius: 24px;
            padding: 40px;
            max-width: 440px;
            text-align: center;
            box-shadow: 0 30px 60px rgba(0,0,0,0.2);
        }
        .box h1 {
            margin-bottom: 20px;
            font-size: 2rem;
        }
        .box p {
            margin-bottom: 28px;
            color: rgba(255,255,255,0.9);
        }
        .btn {
            min-width: 220px;
            padding: 12px 24px;
            border-radius: 999px;
            font-weight: 700;
        }
        .btn-primary {
            background: #fff;
            color: #5b3b8a;
            border: none;
        }
        .btn-secondary {
            background: transparent;
            border: 1px solid rgba(255,255,255,0.55);
            color: #fff;
            margin-left: 10px;
        }
        .help-text {
            margin-top: 20px;
            color: rgba(255,255,255,0.82);
        }
    </style>
</head>
<body>
    <div class="box">
        <h1>Almost there</h1>
        <p>We need to know who you are before continuing to the speech to ISL generator.</p>
        <button class="btn btn-primary" id="continueBtn">Continue</button>
        <p class="help-text">If you already signed up, you will be sent to login automatically.</p>
    </div>
    <script>
        document.getElementById('continueBtn').addEventListener('click', function () {
            const savedUser = localStorage.getItem('voiceIslUser');
            if (savedUser) {
                window.location.href = '/login';
            } else {
                window.location.href = '/signup';
            }
        });
    </script>
</body>
</html>
