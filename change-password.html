<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Change Password - Voice to ISL</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.0/dist/css/bootstrap.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Bree+Serif&family=Raleway:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            background: linear-gradient(135deg, #433d8b 0%, #7f57c5 50%, #c6b3ff 100%);
            color: #fff;
            font-family: 'Raleway', sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .auth-card {
            background: rgba(255,255,255,0.12);
            border: 1px solid rgba(255,255,255,0.18);
            border-radius: 24px;
            padding: 40px;
            width: 100%;
            max-width: 420px;
            box-shadow: 0 30px 60px rgba(0,0,0,0.2);
        }
        .auth-card h2 {
            font-family: 'Bree Serif', serif;
            margin-bottom: 24px;
        }
        .form-control {
            background: rgba(255,255,255,0.12);
            border: 1px solid rgba(255,255,255,0.2);
            color: #fff;
        }
        .form-control::placeholder {
            color: rgba(255,255,255,0.75);
        }
        .btn-primary {
            background: #fff;
            color: #5b3b8a;
            border: none;
            font-weight: 700;
        }
        .btn-secondary {
            background: transparent;
            border: 1px solid rgba(255,255,255,0.35);
            color: #fff;
        }
        .help-text {
            color: #eae3ff;
        }
        .password-wrapper {
            position: relative;
        }
        .password-wrapper .form-control {
            padding-right: 48px;
        }
        .toggle-password {
            position: absolute;
            right: 12px;
            top: 50%;
            transform: translateY(-50%);
            border: none;
            background: transparent;
            color: #fff;
            cursor: pointer;
            font-size: 18px;
            line-height: 1;
            padding: 4px;
        }
    </style>
</head>
<body>
    <div class="auth-card">
        <h2>Change Password</h2>
        <p class="help-text">Enter your account email and choose a new password.</p>
        <form id="changePasswordForm">
            <div class="form-group">
                <label for="changeEmail">Account email</label>
                <input type="email" id="changeEmail" class="form-control" placeholder="Enter account email" required>
            </div>
            <div class="form-group">
                <label for="newPassword">New password</label>
                <div class="password-wrapper">
                    <input type="password" id="newPassword" class="form-control" placeholder="Enter new password" required>
                    <button type="button" class="toggle-password" data-target="newPassword" aria-label="Show new password">&#128065;</button>
                </div>
            </div>
            <div class="form-group">
                <label for="confirmNewPassword">Confirm new password</label>
                <div class="password-wrapper">
                    <input type="password" id="confirmNewPassword" class="form-control" placeholder="Confirm new password" required>
                    <button type="button" class="toggle-password" data-target="confirmNewPassword" aria-label="Show confirm password">&#128065;</button>
                </div>
            </div>
            <button type="submit" class="btn btn-primary btn-block">Update Password</button>
            <a href="/login" class="btn btn-secondary btn-block">Back to Login</a>
        </form>
    </div>

    <script>
        document.querySelectorAll('.toggle-password').forEach(function (button) {
            button.addEventListener('click', function () {
                const input = document.getElementById(button.dataset.target);
                const isHidden = input.type === 'password';
                input.type = isHidden ? 'text' : 'password';
                button.setAttribute('aria-label', isHidden ? 'Hide password' : 'Show password');
            });
        });

        document.getElementById('changePasswordForm').addEventListener('submit', function (event) {
            event.preventDefault();
            const email = document.getElementById('changeEmail').value.trim();
            const newPassword = document.getElementById('newPassword').value;
            const confirmNewPassword = document.getElementById('confirmNewPassword').value;
            const savedUser = localStorage.getItem('voiceIslUser');
            if (!savedUser) {
                alert('No account found. Please sign up first.');
                window.location.href = '/signup';
                return;
            }
            const user = JSON.parse(savedUser);
            if (user.email !== email) {
                alert('Email does not match an existing account.');
                return;
            }
            if (newPassword !== confirmNewPassword) {
                alert('Passwords do not match.');
                return;
            }
            user.password = newPassword;
            localStorage.setItem('voiceIslUser', JSON.stringify(user));
            alert('Password updated successfully. You can log in now.');
            window.location.href = '/login';
        });
    </script>
</body>
</html>
